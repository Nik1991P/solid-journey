<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubrovnik Audio Guide</title>
<style>
body { margin:0; padding:0; font-family:'Segoe UI'; }
</style>
</head>
<body>

<h2>Test verzija</h2>

<input id="name" placeholder="Name"><br>
<input id="surname" placeholder="Surname"><br>
<input id="phone" placeholder="Phone"><br>

<button onclick="selectLang('EN')">English</button>
<button onclick="selectLang('HR')">Hrvatski</button>

<br><br>

<button onclick="sendTour('old')">Old Town</button>
<button onclick="sendTour('road')">Road</button>

<script>
var formData = {};
var selectedLang = "";

// SPREMI OSNOVNE PODATKE
function selectLang(lang){
  selectedLang = lang;

  formData.name = document.getElementById("name").value;
  formData.surname = document.getElementById("surname").value;
  formData.phone = document.getElementById("phone").value;

  alert("Language selected: " + lang);
}

// 🔥 GLAVNO - klik na Old/Road
function sendTour(tourType){
  var url = "https://script.google.com/macros/s/AKfycbxQANWTNU01mrqd-SC_UobDQ6NUbT5d0rHBu2XV4RyHh8NP6mIdMhnLiNdfvXlUfjot1g/exec";

  var params = new URLSearchParams();
  params.append("ime", formData.name);
  params.append("prezime", formData.surname);
  params.append("phone", formData.phone);
  params.append("jezik", selectedLang);
  params.append("tourType", tourType);

  fetch(url + "?" + params.toString(), {
    method: "GET",
    mode: "no-cors"
  });

  alert("Saved: " + tourType);
}
</script>

</body>
</html>
