<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubrovnik Audio Guide</title>
<style>
    body { margin:0; padding:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x:hidden; position:relative; min-height:100vh; background-color: #222; }
    .background { position:fixed; top:0; left:0; width:100%; height:100%; background:url('images/DubrovnikSlika.webp') no-repeat center center; background-size:cover; filter:blur(4px); z-index:-2; }
    .overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:-1; }
    .screen-center { display:flex; justify-content:center; align-items:center; min-height:100vh; flex-direction:column; position:relative; z-index:0; padding: 20px 0; }
    
    .container { background:rgba(0,0,0,0.75); padding:30px; border-radius:15px; width:90%; max-width:450px; text-align:center; color:#fff; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); box-sizing: border-box; margin-bottom: 20px; }
    
    input { width:100%; padding:14px; margin:10px 0; border-radius:8px; border:none; font-size:16px; box-sizing:border-box; color: #333; outline: none; }
    
    button { padding:14px 0; font-size:16px; font-weight: 600; background:#0a7cff; color:white; border:none; border-radius:8px; margin:8px 0; cursor:pointer; width:100%; transition:0.3s; }
    button:hover { background:#005ecb; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button.back-btn { background:#555; margin-top: 15px; }
    
    h2 { margin-bottom:20px; font-size:24px; }
    audio { width:100%; margin-top:10px; border-radius: 5px; }
    
    .main-title { font-size:36px; margin-bottom:5px; font-weight:bold; letter-spacing:1px; text-shadow:0 4px 10px rgba(0,0,0,0.7); }
    .sub-title { font-size:18px; margin-bottom:25px; color:#ccc; text-transform: uppercase; letter-spacing: 2px; }
    
    .error-message { color:#ff6961; margin-top:10px; display:none; font-size: 14px; font-weight:bold; }
    .error-message.show { display:block; }

    .social-links { margin-top: 25px; display: flex; justify-content: center; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; align-items: center; gap: 15px; }
    .social-links a { transition: opacity 0.3s; }
    .social-links a:hover { opacity: 0.7; }
    .app-icon { object-fit: contain; }
    .icon-fb { width: 25px; height: 25px; }
    .icon-ig { width: 30px; height: 30px; }
    .icon-booking { width: 45px; height: 45px; }
</style>
</head>
<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="screen-center">

    <div id="passwordDiv" class="container">
        <h1 class="main-title">Dubrovnik</h1>
        <h3 class="sub-title">Audio Guide</h3>
        <p>Unesite lozinku za pristup:</p>
        <input id="passwordInput" type="password" placeholder="Lozinka">
        <button onclick="provjeriLozinku()">Pristupi</button>
        <p id="passwordError" class="error-message"></p>
        
        <div class="social-links">
            <a href="https://www.facebook.com/share/1C7DNxVRLL/" target="_blank"><img src="images/facebook-icon.png" class="app-icon icon-fb" alt="FB"></a>
            <a href="https://www.instagram.com/hoponhopoffdubrovnik?igsh=MW43YWR0eHJnbDE0dg==" target="_blank"><img src="images/instagram-icon.png" class="app-icon icon-ig" alt="IG"></a>
            <a href="#" target="_blank"><img src="images/booking-icon.png" class="app-icon icon-booking" alt="Booking"></a>
        </div>
    </div>

    <div id="formDiv" class="container" style="display:none">
        <h2>Vaši podaci</h2>
        <input id="name" placeholder="Ime">
        <input id="surname" placeholder="Prezime">
        <input id="phone" type="tel" placeholder="Broj mobitela">
        <button onclick="validirajFormu()">Nastavi</button>
        <p id="formError" class="error-message"></p>
    </div>

    <div id="languageDiv" class="container" style="display:none">
        <h2>Odaberite jezik</h2>
        <button onclick="odaberiJezik('EN')">English</button>
        <button onclick="odaberiJezik('DE')">Deutsch</button>
        <button onclick="odaberiJezik('IT')">Italiano</button>
        <button onclick="odaberiJezik('ES')">Español</button>
        <button onclick="odaberiJezik('HR')">Hrvatski</button>
        <button class="back-btn" onclick="prikaziSekciju('formDiv')">Povratak</button>
    </div>

    <div id="tourDiv" class="container" style="display:none">
        <h2>Odaberite turu</h2>
        <button id="oldBtn" onclick="pokreniTuru('old')"></button>
        <button id="wallsBtn" onclick="pokreniTuru('walls')"></button>
        <button id="cabrioBtn" onclick="pokreniTuru('cabrio')"></button>
        <button class="back-btn" onclick="prikaziSekciju('languageDiv')">Povratak</button>
    </div>

    <div id="audioListDiv" class="container" style="display:none">
        <h2 id="tourTitle">Audio Vodič</h2>
        <div id="audioList"></div>
        <button class="back-btn" onclick="prikaziSekciju('tourDiv')">Nazad na ture</button>
    </div>

</div>

<script>
const tocnaLozinka = "1234";
let podaciKorisnika = {};
let odabraniJezik = "";

const brojAudioStanica = { 
    EN:{old:2, walls:3, cabrio:3}, 
    DE:{old:4, walls:2, cabrio:3}, 
    IT:{old:4, walls:3, cabrio:3}, 
    ES:{old:4, walls:3, cabrio:3}, 
    HR:{old:4, walls:3, cabrio:3} 
};

const prijevodiTura = { 
    EN: {old:"Old Town", walls:"City Walls", cabrio:"Cabrio Tour"}, 
    DE: {old:"Altstadt", walls:"Stadtmauern", cabrio:"Cabrio Tour"}, 
    IT: {old:"Centro Storico", walls:"Mura", cabrio:"Tour in Cabrio"}, 
    ES: {old:"Ciudad Vieja", walls:"Murallas", cabrio:"Tour en Cabrio"}, 
    HR: {old:"Stari Grad", walls:"Zidine", cabrio:"Cabrio tura"} 
};

// Pomoćna funkcija za promjenu ekrana
function prikaziSekciju(id) {
    document.querySelectorAll('.container').forEach(div => div.style.display = 'none');
    document.getElementById(id).style.display = 'block';
    window.scrollTo(0,0);
}

window.onload = function(){
    document.getElementById("passwordInput").addEventListener("keypress", (e) => {
        if(e.key === "Enter") provjeriLozinku();
    });
};

function provjeriLozinku(){
    const unos = document.getElementById("passwordInput").value;
    const errorDiv = document.getElementById("passwordError");
    if(unos === tocnaLozinka){
        prikaziSekciju("formDiv");
    } else {
        errorDiv.textContent = "Pogrešna lozinka";
        errorDiv.classList.add("show");
    }
}

function validirajFormu(){
    const ime = document.getElementById("name").value.trim();
    const prezime = document.getElementById("surname").value.trim();
    const mobitel = document.getElementById("phone").value.trim();
    const errorDiv = document.getElementById("formError");

    if(!ime || !prezime || !mobitel){
        errorDiv.textContent = "Sva polja su obavezna";
        errorDiv.classList.add("show");
        return;
    }

    podaciKorisnika = { ime, prezime, mobitel };
    prikaziSekciju("languageDiv");
}

function odaberiJezik(jezik){
    odabraniJezik = jezik;
    document.getElementById("oldBtn").textContent = prijevodiTura[jezik].old;
    document.getElementById("wallsBtn").textContent = prijevodiTura[jezik].walls;
    document.getElementById("cabrioBtn").textContent = prijevodiTura[jezik].cabrio;
    prikaziSekciju("tourDiv");
}

function pokreniTuru(tip){
    const scriptUrl = "https://script.google.com/macros/s/AKfycbza1righTopeYjGweA8ZaFWDdj7Q9qCWxCzCDyHLgt4d5Sx-zgDP5EwywSheFU55KalrQ/exec";
    const parametri = new URLSearchParams({
        ime: podaciKorisnika.ime,
        prezime: podaciKorisnika.prezime,
        phone: podaciKorisnika.mobitel,
        jezik: odabraniJezik,
        tourType: tip
    });

    // Slanje podataka u Google Sheets (pozadinski)
    fetch(`${scriptUrl}?${parametri.toString()}`, { method: "GET", mode: "no-cors" })
    .catch(err => console.error("Greška kod slanja:", err));

    const listaAudio = document.getElementById("audioList");
    listaAudio.innerHTML = "";
    document.getElementById("tourTitle").textContent = prijevodiTura[odabraniJezik][tip];
    
    const brojStanica = brojAudioStanica[odabraniJezik][tip];
    const baseUrl = "https://nik1991p.github.io/solid-journey/";

    for(let i=1; i<=brojStanica; i++){
        const block = document.createElement("div"); 
        block.style.marginBottom="25px";
        block.style.textAlign="left";
        block.style.borderBottom="1px solid rgba(255,255,255,0.1)";
        block.style.paddingBottom="15px";
        
        const title = document.createElement("p"); 
        title.innerHTML = `<strong>Stanica ${i}</strong>`;
        title.style.margin = "0 0 8px 5px";

        const audio = document.createElement("audio"); 
        audio.controls = true;
        audio.preload = "none";
        audio.controlsList = "nodownload"; 
        audio.src = `${baseUrl}audio/${odabraniJezik.toLowerCase()}/${tip}/${i}.mp3`;
        
        block.appendChild(title); 
        block.appendChild(audio); 
        listaAudio.appendChild(block);
    }
    prikaziSekciju("audioListDiv");
}
</script>

</body>
</html>
