<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dubrovnik Audio Guide</title>
<style>
/* FIKSNA BAZA */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #000;
}

/* POZADINA */
.background-fixed {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('images/DubrovnikSlika.webp') no-repeat center center;
    background-size: cover;
    z-index: -2;
}

.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.2);
    z-index: -1;
}

/* SKROLANJE */
.scroll-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
    display: block;
}

.screen-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100%;
    padding: 40px 0 80px 0;
    box-sizing: border-box;
}

/* TAMNA FORMA */
.container {
    background: rgba(0,0,0,0.85);
    padding: 30px;
    border-radius: 15px;
    width: 85%;
    max-width: 450px;
    text-align: center;
    color: #fff;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    backdrop-filter: blur(2px);
    margin: 20px auto;
}

input { width:90%; padding:12px; margin:10px 0; border-radius:8px; border:none; font-size:16px; box-sizing:border-box; color: #333; }
button { padding:12px 0; font-size:16px; background:#0a7cff; color:white; border:none; border-radius:8px; margin:8px 0; cursor:pointer; width:80%; transition:0.3s; }
button:hover { background:#005ecb; }
button.back-btn { width:80%; background:#0a7cff; }
h2 { margin-bottom:20px; font-size:24px; }
audio { width:100%; margin-top:10px; }
.main-title { font-size:38px; margin-bottom:10px; font-weight:bold; letter-spacing:1px; text-shadow:0 4px 15px rgba(0,0,0,0.7); }
.sub-title { font-size:18px; margin-bottom:25px; color:#ddd; }
.password-wrapper { position: relative; width: 90%; margin: 10px auto; }
.password-wrapper input { width: 100% !important; margin: 0 !important; }
.toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #333; font-size: 18px; user-select: none; }
.error-message { color:#ff6961; margin-top:10px; display:none; font-weight:bold; }
.error-message.show { display:block; opacity:1; }

/* SOCIJALNE IKONE I NOVA STRUKTURA ZA BOOKING SLIKU */
.social-links { 
    margin-top: 25px !important; 
    display: flex !important; 
    justify-content: center !important; 
    border-top: 1px solid rgba(255,255,255,0.2) !important; 
    padding-top: 15px !important; 
    align-items: center !important; 
    gap: 0 !important;
    flex-wrap: wrap !important; 
}

.booking-link-wrapper {
    width: 100% !important;
    display: flex !important;
    justify-content: center !important;
    margin-top: 15px !important;
}

.social-links a { text-decoration: none !important; background: none !important; border: none !important; padding: 0 !important; display: flex !important; align-items: center !important; }
.app-icon { border: none !important; border-radius: 0 !important; background-color: transparent !important; box-shadow: none !important; object-fit: contain !important; }
.icon-fb { width: 25px !important; height: 25px !important; margin-right: 20px !important; }
.icon-ig { width: 30px !important; height: 30px !important; }

.icon-booking { 
    width: 80px !important; 
    height: auto !important; 
    margin-left: 0 !important; 
}
</style>
</head>
<body>

<div class="background-fixed"></div>
<div class="overlay"></div>

<div class="scroll-container">
  <div class="screen-center">

    <div id="passwordDiv" class="container">
      <h1 class="main-title">Dubrovnik Audio Guide</h1>
      <h3 class="sub-title">Private Access</h3>
      <p>Enter password to continue:</p>
      <div class="password-wrapper">
          <input id="passwordInput" type="password" placeholder="Password">
          <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
      </div>
      <button onclick="checkPassword()">Enter</button>
      <p id="passwordError" class="error-message"></p>
      <div class="social-links">
        <a href="https://www.facebook.com/share/1C7DNxVRLL/" target="_blank"><img src="images/facebook-icon.png" class="app-icon icon-fb"></a>
        <a href="https://www.instagram.com/hoponhopoffdubrovnik?igsh=MW43YWR0eHJnbDE0dg==" target="_blank"><img src="images/instagram-icon.png" class="app-icon icon-ig"></a>
        <div class="booking-link-wrapper">
            <a href="https://hop-on-hop-off-dubrovnik.com/" target="_blank"><img src="images/booking-icon.png" class="app-icon icon-booking"></a>
        </div>
      </div>
    </div>

    <div id="formDiv" class="container" style="display:none">
      <h2>Dubrovnik Audio Guide</h2>
      <p>Please enter your details:</p>
      <input id="name" placeholder="Name"><br>
      <input id="surname" placeholder="Surname"><br>
      <input id="phone" type="tel" placeholder="Phone (numbers only)"><br>
      <button onclick="validateForm()">Submit</button>
      <p id="formError" class="error-message"></p>
      <div class="social-links">
        <a href="https://www.facebook.com/share/1C7DNxVRLL/" target="_blank"><img src="images/facebook-icon.png" class="app-icon icon-fb"></a>
        <a href="https://www.instagram.com/hoponhopoffdubrovnik?igsh=MW43YWR0eHJnbDE0dg==" target="_blank"><img src="images/instagram-icon.png" class="app-icon icon-ig"></a>
        <div class="booking-link-wrapper">
            <a href="https://hop-on-hop-off-dubrovnik.com/" target="_blank"><img src="images/booking-icon.png" class="app-icon icon-booking"></a>
        </div>
      </div>
    </div>

    <div id="languageDiv" class="container" style="display:none">
      <h2>Select your language</h2>
      <button onclick="sendDataAndGoToTour('EN')">English</button><br>
      <button onclick="sendDataAndGoToTour('DE')">Deutsch</button><br>
      <button onclick="sendDataAndGoToTour('IT')">Italiano</button><br>
      <button onclick="sendDataAndGoToTour('ES')">Español</button><br>
      <button onclick="sendDataAndGoToTour('FR')">Français</button><br>
      <button onclick="sendDataAndGoToTour('RU')">Pусский</button><br>
      <button onclick="sendDataAndGoToTour('PL')">Polski</button><br>
      <button onclick="sendDataAndGoToTour('SV')">Svenska</button><br>
      <button onclick="sendDataAndGoToTour('CS')">Čeština</button><br>
      <button onclick="sendDataAndGoToTour('ZH')">中文 (Chinese)</button><br>
      <button onclick="sendDataAndGoToTour('TR')">Türkçe</button><br>
      <button onclick="sendDataAndGoToTour('HR')">Hrvatski</button><br>
      <button class="back-btn" onclick="backToForm()">Back</button>
      <div class="social-links">
        <a href="https://www.facebook.com/share/1C7DNxVRLL/" target="_blank"><img src="images/facebook-icon.png" class="app-icon icon-fb"></a>
        <a href="https://www.instagram.com/hoponhopoffdubrovnik?igsh=MW43YWR0eHJnbDE0dg==" target="_blank"><img src="images/instagram-icon.png" class="app-icon icon-ig"></a>
        <div class="booking-link-wrapper">
            <a href="https://hop-on-hop-off-dubrovnik.com/" target="_blank"><img src="images/booking-icon.png" class="app-icon icon-booking"></a>
        </div>
      </div>
    </div>

    <div id="tourDiv" class="container" style="display:none">
      <h2>Select tour type</h2>
      <button id="oldBtn" onclick="submitTour('old')">Old Town</button><br>
      <button id="wallsBtn" onclick="submitTour('walls')">Walls</button><br>
      <button id="cabrioBtn" onclick="submitTour('cabrio')">Cabrio Tour</button><br> 
      <button class="back-btn" onclick="backToLanguage()">Back</button>
      <div class="social-links">
        <a href="https://www.facebook.com/share/1C7DNxVRLL/" target="_blank"><img src="images/facebook-icon.png" class="app-icon icon-fb"></a>
        <a href="https://www.instagram.com/hoponhopoffdubrovnik?igsh=MW43YWR0eHJnbDE0dg==" target="_blank"><img src="images/instagram-icon.png" class="app-icon icon-ig"></a>
        <div class="booking-link-wrapper">
            <a href="https://hop-on-hop-off-dubrovnik.com/" target="_blank"><img src="images/booking-icon.png" class="app-icon icon-booking"></a>
        </div>
      </div>
    </div>

    <div id="audioListDiv" class="container" style="display:none">
      <h2>Audio Guide</h2>
      <div id="audioList"></div>
      <button class="back-btn" onclick="backToTour()">Back</button>
      <div class="social-links">
        <a href="https://www.facebook.com/share/1C7DNxVRLL/" target="_blank"><img src="images/facebook-icon.png" class="app-icon icon-fb"></a>
        <a href="https://www.instagram.com/hoponhopoffdubrovnik?igsh=MW43YWR0eHJnbDE0dg==" target="_blank"><img src="images/instagram-icon.png" class="app-icon icon-ig"></a>
        <div class="booking-link-wrapper">
            <a href="https://hop-on-hop-off-dubrovnik.com/" target="_blank"><img src="images/booking-icon.png" class="app-icon icon-booking"></a>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
var scriptUrl = "https://script.google.com/macros/s/AKfycbz8PYiMtbWsQxJ7hP_hBEtv2DCQsPxtoUXSW-1jFvxB2y_Lxta3i-0b_Dw3KzgiArbseg/exec"; 
var formData = {};
var selectedLang = "";
var currentStep = "password";

var tours = { 
    EN:{old:37, walls:16, cabrio:0}, 
    DE:{old:37, walls:16, cabrio:7}, 
    IT:{old:37, walls:16, cabrio:9}, 
    ES:{old:37, walls:16, cabrio:7}, 
    FR:{old:37, walls:16, cabrio:6}, 
    RU:{old:37, walls:16, cabrio:0},
    PL:{old:37, walls:27, cabrio:0},
    SV:{old:38, walls:27, cabrio:0},
    CS:{old:37, walls:27, cabrio:0},
    ZH:{old:37, walls:16, cabrio:0},
    TR:{old:37, walls:0, cabrio:0},
    HR:{old:37, walls:16, cabrio:0} 
};
var tourTranslations = { 
    EN:{old:"Old Town", walls:"Walls", cabrio:"Cabrio Tour"}, 
    DE:{old:"Altstadt", walls:"Stadtmauern", cabrio:"Cabrio Tour"}, 
    IT:{old:"Centro Storico", walls:"Mura", cabrio:"Tour in Cabrio"}, 
    ES:{old:"Ciudad Vieja", walls:"Murallas", cabrio:"Tour en Cabrio"}, 
    FR:{old:"Vieille Ville", walls:"Remparts", cabrio:"Tour en Cabrio"}, 
    RU:{old:"Старый город", walls:"Стены", cabrio:"Кабрио тур"},
    PL:{old:"Stare Miasto", walls:"Mury", cabrio:"Wycieczka Cabrio"},
    SV:{old:"Gamla stan", walls:"Murarna", cabrio:"Cabrio Tour"},
    CS:{old:"Staré Město", walls:"Hradby", cabrio:"Cabrio Tour"},
    ZH:{old:"老城", walls:"城墙", cabrio:"敞篷巴士之旅"},
    TR:{old:"Eski Şehir", walls:"Surlar", cabrio:"Cabrio Turu"},
    HR:{old:"Stari Grad", walls:"Zidine", cabrio:"Cabrio tura"} 
};

window.onpopstate = function(event) {
  if (currentStep === "form") backToStart();
  else if (currentStep === "language") backToForm();
  else if (currentStep === "tour") backToLanguage();
  else if (currentStep === "audio") backToTour();
};

function goToStep(stepId, stepName) {
  document.querySelectorAll('.container').forEach(div => div.style.display = 'none');
  document.getElementById(stepId).style.display = 'block';
  document.querySelector('.scroll-container').scrollTop = 0;
  currentStep = stepName;
  history.pushState({step: stepName}, "");
}

window.onload = function(){
  document.getElementById("passwordInput").addEventListener("keypress", function(e){ if(e.key==="Enter") checkPassword(); });
};

function togglePasswordVisibility() {
  var input = document.getElementById("passwordInput");
  var icon = document.querySelector(".toggle-password");
  if (input.type === "password") { input.type = "text"; icon.textContent = "🙈"; } 
  else { input.type = "password"; icon.textContent = "👁️"; }
}

function checkPassword(){
  var input = document.getElementById("passwordInput").value;
  var errorDiv = document.getElementById("passwordError");
  errorDiv.textContent = "Checking...";
  errorDiv.classList.add("show");
  fetch(scriptUrl + "?checkPass=true").then(r => r.text()).then(pass => {
      if(input === pass.trim()){
        errorDiv.classList.remove("show");
        goToStep("formDiv", "form");
      } else { errorDiv.textContent = "Wrong password"; errorDiv.classList.add("show"); }
  }).catch(() => { if(input === "1234") { goToStep("formDiv", "form"); } });
}

function validateForm(){
  var name=document.getElementById("name").value.trim();
  var surname=document.getElementById("surname").value.trim();
  var phoneRaw=document.getElementById("phone").value.trim().replace(/\s+/g,'');
  var errorDiv=document.getElementById("formError");
  if(!name || !surname || !phoneRaw){ errorDiv.textContent="All fields are required"; errorDiv.classList.add("show"); return false; }
  errorDiv.classList.remove("show");
  formData.name = name; formData.surname = surname; formData.phone = phoneRaw;
  goToStep("languageDiv", "language");
}

function sendDataAndGoToTour(lang){
  selectedLang = lang;
  document.getElementById("oldBtn").textContent = tourTranslations[lang].old;
  document.getElementById("wallsBtn").textContent = tourTranslations[lang].walls;
  document.getElementById("cabrioBtn").textContent = tourTranslations[lang].cabrio;
  goToStep("tourDiv", "tour");
}

function submitTour(type){
  var params = new URLSearchParams();
  params.append("ime", formData.name);
  params.append("prezime", formData.surname);
  params.append("phone", formData.phone);
  params.append("jezik", selectedLang);
  params.append("tourType", type);
  fetch(scriptUrl + "?" + params.toString(), { method: "GET", mode: "no-cors" });

  goToStep("audioListDiv", "audio");

  var container = document.getElementById("audioList");
  container.innerHTML = "";
  
  var introTranslations = { 
    EN:"Introduction", DE:"Einleitung", IT:"Introduzione", ES:"Introducción", 
    FR:"Introduction", RU:"Введение", PL:"Wprowadzenie", SV:"Introduktion", 
    CS:"Úvod", ZH:"介绍", TR:"Giriš", HR:"Uvod" 
  };

  var count = tours[selectedLang][type];
  var baseUrl = "https://nik1991p.github.io/solid-journey/";
  
  for(let i=0; i<=count; i++){
    var block = document.createElement("div"); 
    block.style.marginBottom="20px"; block.style.paddingBottom="10px"; block.style.borderBottom="1px solid #555";
    
    var title = document.createElement("p"); 
    title.textContent = (i === 0) ? introTranslations[selectedLang] : "Stop " + i;
    title.style.fontWeight = "bold";
    
    var audio = document.createElement("audio"); 
    audio.controls = true; audio.preload = "none";
    
    var path1 = baseUrl + "audio/" + selectedLang.toLowerCase() + "/" + type + "/" + i + ".mp3";
    var path2 = baseUrl + "audio/" + selectedLang.toLowerCase() + "%2F" + type + "/" + i + ".mp3";
    var path3 = baseUrl + "audio/" + selectedLang.toLowerCase() + "/" + type + "/" + i + ".MP3";

    audio.src = path1;

    audio.onerror = function() {
        if (this.src.includes(encodeURIComponent(type))) {
             this.src = path3;
        } else if (this.src === path1) {
             this.src = path2;
        } else {
             if(i === 0) {
                 block.style.display = "none";
             }
        }
    };
    
    audio.onplay = function() {
        document.querySelectorAll('audio').forEach(otherAudio => {
            if (otherAudio !== this) {
                otherAudio.pause();
                otherAudio.currentTime = 0;
            }
        });
    };

    block.appendChild(title); block.appendChild(audio); container.appendChild(block);
  }
}

function backToStart() { 
    goToStep("passwordDiv", "password");
}
function backToForm(){ goToStep("formDiv", "form"); }
function backToLanguage(){ goToStep("languageDiv", "language"); }
function backToTour(){ goToStep("tourDiv", "tour"); }
</script>
</body>
</html>
