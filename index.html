<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubrovnik Audio Guide</title>

<style>
body { margin:0; padding:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

body::before {
  content:"";
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:url('images/DubrovnikSlika.webp') no-repeat center center;
  background-size:cover;
  filter:blur(4px); transform:scale(1.05); z-index:-1;
}

body::after {
  content:"";
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.3); z-index:-1;
}

.screen-center { display:flex; justify-content:center; align-items:center; height:100vh; }

.container {
  background:rgba(0,0,0,0.6);
  padding:30px;
  border-radius:15px;
  width:90%;
  max-width:400px;
  text-align:center;
  color:#fff;
}

input {
  width:90%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:none;
  font-size:16px;
}

button {
  padding:12px 25px;
  font-size:16px;
  background:#0a7cff;
  color:white;
  border:none;
  border-radius:8px;
  margin:5px;
  cursor:pointer;
  transition:0.3s;
}

button:hover { background:#005ecb; }

h2 { margin-bottom:20px; font-size:24px; }

#languageDiv button { width:80%; margin:8px 0; }

  .main-title {
  font-size: 32px;
  margin-bottom: 10px;
  font-weight: bold;
  letter-spacing: 1px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.sub-title {
  font-size: 18px;
  margin-bottom: 20px;
  color: #ddd;
}
audio { width:100%; margin-top:15px; }
</style>
</head>

<body>

<div class="screen-center">

  <!-- PASSWORD SCREEN -->
  <div id="passwordDiv" class="container">
  <h1 class="main-title">Dubrovnik Audio Guide</h1>
  <h3 class="sub-title">Private Access</h3>

  <p>Enter password to continue:</p>

  <input id="passwordInput" type="password" placeholder="Password"><br>
  <button onclick="checkPassword()">Enter</button>
</div>

  <!-- FORM -->
  <div id="formDiv" class="container" style="display:none">
    <h2>Dubrovnik Audio Guide</h2>
    <p>Please enter your details:</p>
    <input id="name" placeholder="Name"><br>
    <input id="surname" placeholder="Surname"><br>
    <input id="phone" placeholder="Phone"><br>
    <button onclick="submitForm()">Submit</button>
  </div>

  <!-- LANGUAGE -->
  <div id="languageDiv" class="container" style="display:none">
    <h2>Select your language</h2>
    <button onclick="selectLanguage('EN')">English</button><br>
    <button onclick="selectLanguage('HR')">Hrvatski</button><br>
    <button onclick="selectLanguage('DE')">Deutsch</button><br><br>
    <button onclick="backToForm()">Back</button>

    <p id="playHint" style="display:none;">Kliknite ▶️ za reprodukciju</p>
    <audio id="audioPlayer" controls style="display:none"></audio>
  </div>

</div>

<script>

var correctPassword = "1234"; // 🔐 PROMIJENI OVO

var formData = {};

var audioLinks = {
  EN: "https://nik1991p.github.io/solid-journey/audio/audio_en.mp3",
  HR: "https://nik1991p.github.io/solid-journey/audio/audio_hr.mp3",
  DE: "https://nik1991p.github.io/solid-journey/audio/audio_de.mp3"
};

// ENTER za password
document.getElementById("passwordInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    checkPassword();
  }
});

function checkPassword() {
  var input = document.getElementById("passwordInput").value;

  if(input === correctPassword){
    document.getElementById("passwordDiv").style.display = "none";
    document.getElementById("formDiv").style.display = "block";
  } else {
    alert("Wrong password!");
  }
}

function submitForm() {
  var name = document.getElementById("name").value.trim();
  var surname = document.getElementById("surname").value.trim();
  var phone = document.getElementById("phone").value.trim();

  if(!name || !surname || !phone){
    alert("Please fill all fields!");
    return;
  }

  formData.ime = name;
  formData.prezime = surname;
  formData.phone = phone;

  document.getElementById("formDiv").style.display = "none";
  document.getElementById("languageDiv").style.display = "block";
}

function selectLanguage(lang) {

  formData.jezik = lang;

  var url = "https://script.google.com/macros/s/AKfycbzMJ-btB9GKhH9IquoDCPVzRkmZmA0iAtEInZG2mhWXl207tp7NcitRkaTmooNsYp1qKQ/exec"
    + "?ime=" + encodeURIComponent(formData.ime)
    + "&prezime=" + encodeURIComponent(formData.prezime)
    + "&phone=" + encodeURIComponent(formData.phone)
    + "&jezik=" + encodeURIComponent(formData.jezik);

  var iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = url;
  document.body.appendChild(iframe);

  // audio
  var player = document.getElementById("audioPlayer");

  player.pause();
  player.currentTime = 0;
  player.src = audioLinks[lang];
  player.style.display = "block";
  player.load();

  document.getElementById("playHint").style.display = "block";
}

function backToForm() {
  document.getElementById("languageDiv").style.display = "none";
  document.getElementById("formDiv").style.display = "block";
  document.getElementById("audioPlayer").style.display = "none";
}

</script>

</body>
</html>
