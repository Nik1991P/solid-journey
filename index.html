<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubrovnik Audio Guide</title>

<style>
body { margin:0; padding:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x:hidden; position:relative; min-height:100vh; }

.background {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background:url('images/DubrovnikSlika.webp') no-repeat center center;
  background-size:cover;
  filter:blur(4px);
  z-index:-2;
}

.overlay {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.3);
  z-index:-1;
}

.screen-center {
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  flex-direction:column;
}

.container {
  background:rgba(0,0,0,0.6);
  padding:30px;
  border-radius:15px;
  width:90%;
  max-width:500px;
  text-align:center;
  color:#fff;
}

input {
  width:90%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:none;
  font-size:16px;
}

button {
  width:80%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:8px;
  background:#0a7cff;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover { background:#005ecb; }

h2 { margin-bottom:20px; }
audio { width:100%; margin-top:10px; }

.error-message {
  color:#ff6961;
  display:none;
}
.error-message.show {
  display:block;
}
</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="screen-center">

<!-- PASSWORD -->
<div id="passwordDiv" class="container">
<h2>Dubrovnik Audio Guide</h2>
<input id="passwordInput" type="password" placeholder="Password"><br>
<button onclick="checkPassword()">Enter</button>
<p id="passwordError" class="error-message"></p>
</div>

<!-- FORM -->
<div id="formDiv" class="container" style="display:none">
<h2>Enter your details</h2>
<input id="name" placeholder="Name"><br>
<input id="surname" placeholder="Surname"><br>
<input id="phone" placeholder="Phone"><br>
<button onclick="validateForm()">Submit</button>
<p id="formError" class="error-message"></p>
</div>

<!-- LANGUAGE -->
<div id="languageDiv" class="container" style="display:none">
<h2>Select language</h2>
<button onclick="selectLanguage('EN')">English</button>
<button onclick="selectLanguage('HR')">Hrvatski</button>
<button onclick="selectLanguage('DE')">Deutsch</button>
</div>

<!-- TOUR -->
<div id="tourDiv" class="container" style="display:none">
<h2>Select tour</h2>
<button onclick="playAudioList('old')">Old Town</button>
<button onclick="playAudioList('road')">Road</button>
</div>

<!-- AUDIO -->
<div id="audioListDiv" class="container" style="display:none">
<h2>Audio Guide</h2>
<div id="audioList"></div>
</div>

</div>

<script>
var correctPassword = "1234";
var formData = {};
var selectedLang = "";

var tours = {
  EN:{old:4,road:3},
  HR:{old:4,road:3},
  DE:{old:4,road:2}
};

// PASSWORD
function checkPassword(){
  var input=document.getElementById("passwordInput").value;
  var error=document.getElementById("passwordError");

  if(input===correctPassword){
    document.getElementById("passwordDiv").style.display="none";
    document.getElementById("formDiv").style.display="block";
  } else {
    error.textContent="Wrong password";
    error.classList.add("show");
  }
}

// VALIDACIJA
function validateForm(){
  var name=document.getElementById("name").value.trim();
  var surname=document.getElementById("surname").value.trim();
  var phone=document.getElementById("phone").value.trim().replace(/\s+/g,'');

  var error=document.getElementById("formError");

  if(!name || !surname || !phone){
    error.textContent="All fields required";
    error.classList.add("show");
    return;
  }

  if(!/^[0-9]+$/.test(phone)){
    error.textContent="Phone must be numbers";
    error.classList.add("show");
    return;
  }

  formData = { name, surname, phone };

  document.getElementById("formDiv").style.display="none";
  document.getElementById("languageDiv").style.display="block";
}

// LANGUAGE
function selectLanguage(lang){
  selectedLang = lang;
  document.getElementById("languageDiv").style.display="none";
  document.getElementById("tourDiv").style.display="block";
}

// 🔥 SLANJE PODATAKA (SAMO OVDJE)
function sendDataToSheet(tourType){
  var url = "https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbxhNAB4gcStUQ2AsiFDehLPSJdip8VpRuZvOXGdLYZ1gDkt-aSrEYbfcBBn60TYfNXk/exec";

  var params = new URLSearchParams();
  params.append("ime", formData.name);
  params.append("prezime", formData.surname);
  params.append("phone", formData.phone);
  params.append("jezik", selectedLang);
  params.append("tourType", tourType === "old" ? "Old Town" : "Road");

  fetch(url + "?" + params.toString(), {
    method: "GET",
    mode: "no-cors"
  });
}

// AUDIO + SLANJE
function playAudioList(type){

  sendDataToSheet(type);

  document.getElementById("tourDiv").style.display="none";
  document.getElementById("audioListDiv").style.display="block";

  var container=document.getElementById("audioList");
  container.innerHTML="";

  var count=tours[selectedLang][type];

  for(let i=1;i<=count;i++){
    var div=document.createElement("div");

    var title=document.createElement("p");
    title.textContent="Stop "+i;

    var audio=document.createElement("audio");
    audio.controls=true;
    audio.src="audio/"+selectedLang.toLowerCase()+"/"+type+"/"+i+".mp3";

    div.appendChild(title);
    div.appendChild(audio);

    container.appendChild(div);
  }
}
</script>

</body>
</html>
