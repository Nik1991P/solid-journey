<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubrovnik Audio Guide</title>
<style>
/* Ovdje ide tvoj postojeći CSS, ništa se ne mijenja */
</style>
</head>
<body>

<!-- Tvoj postojeći HTML -->
<div class="screen-center">
<div id="passwordDiv" class="container login-container">
<h1 class="main-title">Dubrovnik Audio Guide</h1>
<h3 class="sub-title">Private Access</h3>
<p>Enter password to continue:</p>
<input id="passwordInput" type="password" placeholder="Password"><br>
<button onclick="checkPassword()">Enter</button>
<p id="passwordError" class="error-message"></p>
</div>

<div id="formDiv" class="container" style="display:none">
<h2>Dubrovnik Audio Guide</h2>
<p>Please enter your details:</p>
<input id="name" placeholder="Name"><br>
<input id="surname" placeholder="Surname"><br>
<input id="phone" placeholder="Phone"><br>
<button onclick="validateForm()">Submit</button>
<p id="formError" class="error-message"></p>
</div>

<div id="languageDiv" class="container" style="display:none">
<h2>Select your language</h2>
<button onclick="selectLanguage('EN')">English</button><br>
<button onclick="selectLanguage('DE')">Deutsch</button><br>
<button onclick="selectLanguage('IT')">Italiano</button><br>
<button onclick="selectLanguage('ES')">Español</button><br>
<button onclick="selectLanguage('HR')">Hrvatski</button><br>
<button class="back-btn" onclick="backToForm()">Back</button>
</div>

<div id="tourDiv" class="container" style="display:none">
<h2>Select tour type</h2>
<button id="btnOldTown" onclick="submitTour('old')">Old Town</button><br>
<button id="btnRoad" onclick="submitTour('road')">Road</button><br>
<button class="back-btn" onclick="backToLanguage()">Back</button>
</div>

<div id="audioListDiv" class="container" style="display:none">
<h2>Audio Guide</h2>
<div id="audioList"></div>
<button class="back-btn" onclick="backToTour()">Back</button>
</div>
</div>

<script>
var correctPassword="1234";
var formData={};
var selectedLang="";
var tours={EN:{old:4,road:3}, HR:{old:4,road:3}, DE:{old:4,road:2}, IT:{old:4,road:3}, ES:{old:4,road:3}};
var tourTranslations={
EN:{old:"Old Town", road:"Road"},
DE:{old:"Altstadt", road:"Straße"},
IT:{old:"Centro Storico", road:"Strada"},
ES:{old:"Casco Antiguo", road:"Carretera"},
HR:{old:"Stari Grad", road:"Cesta"}
};

window.onload=function(){
document.getElementById("passwordInput").addEventListener("keypress",function(e){
if(e.key==="Enter") checkPassword();
});
};

function checkPassword(){
var input=document.getElementById("passwordInput").value;
var errorDiv=document.getElementById("passwordError");
if(input===correctPassword){
errorDiv.classList.remove("show");
document.getElementById("passwordDiv").style.display="none";
document.getElementById("formDiv").style.display="block";
}else{
errorDiv.textContent="Wrong password";
errorDiv.classList.add("show");
}
}

function validateForm(){
var name=document.getElementById("name").value.trim();
var surname=document.getElementById("surname").value.trim();
var phone=document.getElementById("phone").value.trim().replace(/\s+/g,'');
var errorDiv=document.getElementById("formError");
if(!name || !surname || !phone){
errorDiv.textContent="All fields are required"; errorDiv.classList.add("show"); return false;
}
if(!/^[0-9]+$/.test(phone)){
errorDiv.textContent="Phone must contain only digits"; errorDiv.classList.add("show"); return false;
}
if(phone.length<5){ errorDiv.textContent="Phone must be at least 5 digits"; errorDiv.classList.add("show"); return false; }
errorDiv.classList.remove("show");
formData.name=name; formData.surname=surname; formData.phone=phone;
document.getElementById("formDiv").style.display="none";
document.getElementById("languageDiv").style.display="block";
}

function selectLanguage(lang){
selectedLang=lang;
document.getElementById("languageDiv").style.display="none";
document.getElementById("tourDiv").style.display="block";
document.getElementById("btnOldTown").textContent=tourTranslations[lang].old;
document.getElementById("btnRoad").textContent=tourTranslations[lang].road;
}

function submitTour(type){
formData.tourType=type;
sendDataToSheet();
document.getElementById("tourDiv").style.display="none";
document.getElementById("audioListDiv").style.display="block";

var container=document.getElementById("audioList");
container.innerHTML="";
var count=tours[selectedLang][type];
for(let i=1;i<=count;i++){
var block=document.createElement("div"); block.style.marginBottom="15px";
var title=document.createElement("p"); title.textContent="Stop "+i;
var audio=document.createElement("audio"); audio.controls=true;
audio.src="audio/"+selectedLang.toLowerCase()+"/"+type+"/"+i+".mp3";
block.appendChild(title); block.appendChild(audio); container.appendChild(block);
}
}

function sendDataToSheet(){
var url="https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbxcpv9kU3mv6L3Psf2bHRUx1hV0C7bDBuYxJ5ctVv6r8OjKfRR8RpGdIT7zYqAhsb_fow/exec/exec"; // zamijeni sa svojim Apps Script URL
fetch(url,{
method:"POST",
mode:"no-cors",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
ime:formData.name,
prezime:formData.surname,
phone:formData.phone,
jezik:selectedLang,
tourType:formData.tourType
})
}).then(()=>console.log("Data sent:",formData))
.catch(err=>console.log("Error sending tour:",err));
}

function backToForm(){document.getElementById("languageDiv").style.display="none"; document.getElementById("formDiv").style.display="block";}
function backToLanguage(){document.getElementById("tourDiv").style.display="none"; document.getElementById("languageDiv").style.display="block";}
function backToTour(){document.getElementById("audioListDiv").style.display="none"; document.getElementById("tourDiv").style.display="block";}
</script>

</body>
</html>
