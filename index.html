<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubrovnik Audio Guide</title>
<style>
body { margin:0; padding:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x:hidden; position:relative; min-height:100vh; }
.background { position:absolute; top:0; left:0; width:100%; height:100%; background:url('images/DubrovnikSlika.webp') no-repeat center center; background-size:cover; filter:blur(4px); z-index:-2; }
.overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); z-index:-1; }
.screen-center { display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; position:relative; z-index:0; }
.container { background:rgba(0,0,0,0.6); padding:30px; border-radius:15px; width:90%; max-width:500px; text-align:center; color:#fff; }
input { width:90%; padding:12px; margin:10px 0; border-radius:8px; border:none; font-size:16px; }
button { padding:12px 25px; font-size:16px; background:#0a7cff; color:white; border:none; border-radius:8px; margin:5px; cursor:pointer; transition:0.3s; }
button:hover { background:#005ecb; }
h2 { margin-bottom:20px; font-size:24px; }
#languageDiv button { width:80%; margin:8px 0; }
audio { width:100%; margin-top:15px; }
.main-title { font-size:42px; margin-bottom:10px; font-weight:bold; letter-spacing:1px; text-shadow:0 4px 15px rgba(0,0,0,0.7); }
.sub-title { font-size:20px; margin-bottom:25px; color:#ddd; }
.login-container { max-width:500px; padding:40px 30px; }
.error-message { color:#ff6961; margin-top:10px; display:none; font-weight:bold; transition:opacity 0.3s; opacity:0; }
.error-message.show { display:block; opacity:1; }
</style>
</head>
<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="screen-center">

<!-- PASSWORD SCREEN -->
<div id="passwordDiv" class="container login-container">
<h1 class="main-title">Dubrovnik Audio Guide</h1>
<h3 class="sub-title">Private Access</h3>
<p>Enter password to continue:</p>
<input id="passwordInput" type="password" placeholder="Password"><br>
<button onclick="checkPassword()">Enter</button>
<p id="passwordError" class="error-message"></p>
</div>

<!-- FORM -->
<div id="formDiv" class="container" style="display:none">
<h2>Dubrovnik Audio Guide</h2>
<p>Please enter your details:</p>
<input id="name" placeholder="Name"><br>
<input id="surname" placeholder="Surname"><br>
<input id="phone" placeholder="Phone"><br>
<button onclick="validateForm()">Submit</button>
<p id="formError" class="error-message"></p>
<iframe name="hiddenIframe" style="display:none;"></iframe>
</div>

<!-- LANGUAGE -->
<div id="languageDiv" class="container" style="display:none">
<h2>Select your language</h2>
<button onclick="selectLanguage('EN')">English</button><br>
<button onclick="selectLanguage('HR')">Hrvatski</button><br>
<button onclick="selectLanguage('DE')">Deutsch</button><br><br>
<button onclick="backToForm()">Back</button>
<p id="playHint" style="display:none;">Kliknite ▶️ za reprodukciju</p>
<audio id="audioPlayer" controls style="display:none"></audio>
</div>

</div>

<script>
var correctPassword = "1234";
var audioLinks = {
  EN: "https://nik1991p.github.io/solid-journey/audio/audio_en.mp3",
  HR: "https://nik1991p.github.io/solid-journey/audio/audio_hr.mp3",
  DE: "https://nik1991p.github.io/solid-journey/audio/audio_de.mp3"
};

var formData = {};

// ENTER za password
window.onload = function(){
  document.getElementById("passwordInput").addEventListener("keypress", function(e){
    if(e.key==="Enter") checkPassword();
  });
};

// CHECK PASSWORD
function checkPassword(){
  var input=document.getElementById("passwordInput").value;
  var errorDiv=document.getElementById("passwordError");
  if(input===correctPassword){
    errorDiv.classList.remove("show");
    document.getElementById("passwordDiv").style.display="none";
    document.getElementById("formDiv").style.display="block";
  }else{
    errorDiv.textContent="Wrong password";
    errorDiv.classList.add("show");
  }
}

// VALIDACIJA FORME
function validateForm(){
  var name=document.getElementById("name").value.trim();
  var surname=document.getElementById("surname").value.trim();
  var phone=document.getElementById("phone").value.trim();
  var errorDiv=document.getElementById("formError");

  if(!name || !surname || !phone){
    errorDiv.textContent="All fields are required";
    errorDiv.classList.add("show");
    return false;
  }

  if(!/^[0-9]+$/.test(phone)){
    errorDiv.textContent="Phone must contain only digits";
    errorDiv.classList.add("show");
    return false;
  }

  if(phone.length<5){
    errorDiv.textContent="Phone must be at least 5 digits";
    errorDiv.classList.add("show");
    return false;
  }

  errorDiv.classList.remove("show");

  // spremanje podataka u formData
  formData.name = name;
  formData.surname = surname;
  formData.phone = phone;

  // prikaz language div
  document.getElementById("formDiv").style.display="none";
  document.getElementById("languageDiv").style.display="block";
}

// FUNKCIJA ZA ODABIR JEZIKA I SLANJE PODATAKA
function selectLanguage(lang){
  formData.lang = lang;

  // šaljemo podatke u Google Sheet preko iframe
  var iframe = document.createElement('iframe');
  iframe.name = "hiddenIframe";
  iframe.style.display = "none";
  iframe.src = "https://script.google.com/macros/s/AKfycbzMJ-btB9GKhH9IquoDCPVzRkmZmA0iAtEInZG2mhWXl207tp7NcitRkaTmooNsYp1qKQ/exec"
    +"?ime="+encodeURIComponent(formData.name)
    +"&prezime="+encodeURIComponent(formData.surname)
    +"&phone="+encodeURIComponent(formData.phone)
    +"&jezik="+encodeURIComponent(formData.lang);
  document.body.appendChild(iframe);

  // pokreni audio
  var player = document.getElementById("audioPlayer");
  player.pause();
  player.currentTime = 0;
  player.src = audioLinks[lang];
  player.style.display="block";
  player.load();
  document.getElementById("playHint").style.display="block";
}

// BACK BUTTON
function backToForm(){
  document.getElementById("languageDiv").style.display="none";
  document.getElementById("formDiv").style.display="block";
  document.getElementById("audioPlayer").style.display="none";
}
</script>

</body>
</html>
