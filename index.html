<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubrovnik Audio Guide</title>
<style>
body { margin:0; padding:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x:hidden; position:relative; min-height:100vh; }
.background { position:absolute; top:0; left:0; width:100%; height:100%; background:url('images/DubrovnikSlika.webp') no-repeat center center; background-size:cover; filter:blur(4px); z-index:-2; }
.overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); z-index:-1; }
.screen-center { display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; position:relative; z-index:0; }
.container { background:rgba(0,0,0,0.6); padding:30px; border-radius:15px; width:90%; max-width:500px; text-align:center; color:#fff; position: relative; }
input { width:90%; padding:12px; margin:10px 0; border-radius:8px; border:none; font-size:16px; box-sizing:border-box; color: #333; }
button { padding:12px 0; font-size:16px; background:#0a7cff; color:white; border:none; border-radius:8px; margin:8px 0; cursor:pointer; width:80%; transition:0.3s; }
button:hover { background:#005ecb; }
button.back-btn { width:80%; background:#0a7cff; }
button.back-btn:hover { background:#005ecb; }
h2 { margin-bottom:20px; font-size:24px; }
audio { width:100%; margin-top:10px; }
.main-title { font-size:42px; margin-bottom:10px; font-weight:bold; letter-spacing:1px; text-shadow:0 4px 15px rgba(0,0,0,0.7); }
.sub-title { font-size:20px; margin-bottom:25px; color:#ddd; }
.login-container { max-width:500px; padding:40px 30px; }
.error-message { color:#ff6961; margin-top:10px; display:none; font-weight:bold; transition:opacity 0.3s; opacity:0; }
.error-message.show { display:block; opacity:1; }

.social-links {
  margin-top: 25px !important;
  display: flex !important;
  justify-content: center !important;
  border-top: 1px solid rgba(255,255,255,0.2) !important;
  padding-top: 15px !important;
  align-items: center !important;
  gap: 0 !important;
}
.social-links a {
  text-decoration: none !important;
  background: none !important;
  border: none !important;
  padding: 0 !important;
  display: flex !important;
  align-items: center !important;
}
.app-icon {
  border: none !important;
  border-radius: 0 !important;
  background-color: transparent !important;
  box-shadow: none !important;
  object-fit: contain !important;
}

.icon-fb { width: 25px !important; height: 25px !important; margin-right: 20px !important; }
.icon-ig { width: 30px !important; height: 30px !important; }
.icon-booking { width: 45px !important; height: 45px !important; margin-left: 12px !important; }
</style>
</head>
<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="screen-center">

<div id="passwordDiv" class="container login-container">
<h1 class="main-title">Dubrovnik Audio Guide</h1>
<h3 class="sub-title">Private Access</h3>
<p>Enter password to continue:</p>
<input id="passwordInput" type="password" placeholder="Password"><br>
<button onclick="checkPassword()">Enter</button>
<p id="passwordError" class="error-message"></p>
<div class="social-links">
  <a href="https://www.facebook.com/share/1C7DNxVRLL/" target="_blank"><img src="images/facebook-icon.png" class="app-icon icon-fb"></a>
  <a href="https://www.instagram.com/hoponhopoffdubrovnik?igsh=MW43YWR0eHJnbDE0dg==" target="_blank"><img src="images/instagram-icon.png" class="app-icon icon-ig"></a>
  <a href="#" target="_blank"><img src="images/booking-icon.png" class="app-icon icon-booking"></a>
</div>
</div>

<div id="formDiv" class="container" style="display:none">
<h2>Dubrovnik Audio Guide</h2>
<p>Please enter your details:</p>
<input id="name" placeholder="Name"><br>
<input id="surname" placeholder="Surname"><br>
<input id="phone" placeholder="Phone"><br>
<button onclick="validateForm()">Submit</button>
<p id="formError" class="error-message"></p>
<div class="social-links">
  <a href="https://www.facebook.com/share/1C7DNxVRLL/" target="_blank"><img src="images/facebook-icon.png" class="app-icon icon-fb"></a>
  <a href="https://www.instagram.com/hoponhopoffdubrovnik?igsh=MW43YWR0eHJnbDE0dg==" target="_blank"><img src="images/instagram-icon.png" class="app-icon icon-ig"></a>
  <a href="#" target="_blank"><img src="images/booking-icon.png" class="app-icon icon-booking"></a>
</div>
</div>

<div id="languageDiv" class="container" style="display:none">
<h2>Select your language</h2>
<button onclick="sendDataAndGoToTour('EN')">English</button><br>
<button onclick="sendDataAndGoToTour('DE')">Deutsch</button><br>
<button onclick="sendDataAndGoToTour('IT')">Italiano</button><br>
<button onclick="sendDataAndGoToTour('ES')">Español</button><br>
<button onclick="sendDataAndGoToTour('HR')">Hrvatski</button><br>
<button class="back-btn" onclick="backToForm()">Back</button>
<div class="social-links">
  <a href="https://www.facebook.com/share/1C7DNxVRLL/" target="_blank"><img src="images/facebook-icon.png" class="app-icon icon-fb"></a>
  <a href="https://www.instagram.com/hoponhopoffdubrovnik?igsh=MW43YWR0eHJnbDE0dg==" target="_blank"><img src="images/instagram-icon.png" class="app-icon icon-ig"></a>
  <a href="#" target="_blank"><img src="images/booking-icon.png" class="app-icon icon-booking"></a>
</div>
</div>

<div id="tourDiv" class="container" style="display:none">
<h2>Select tour type</h2>
<button id="oldBtn" onclick="submitTour('old')">Old Town</button><br>
<button id="wallsBtn" onclick="submitTour('walls')">Walls</button><br>
<button id="cabrioBtn" onclick="submitTour('cabrio')">Cabrio Tour</button><br> <button class="back-btn" onclick="backToLanguage()">Back</button>
<div class="social-links">
  <a href="https://www.facebook.com/share/1C7DNxVRLL/" target="_blank"><img src="images/facebook-icon.png" class="app-icon icon-fb"></a>
  <a href="https://www.instagram.com/hoponhopoffdubrovnik?igsh=MW43YWR0eHJnbDE0dg==" target="_blank"><img src="images/instagram-icon.png" class="app-icon icon-ig"></a>
  <a href="#" target="_blank"><img src="images/booking-icon.png" class="app-icon icon-booking"></a>
</div>
</div>

<div id="audioListDiv" class="container" style="display:none">
<h2>Audio Guide</h2>
<div id="audioList"></div>
<button class="back-btn" onclick="backToTour()">Back</button>
<div class="social-links">
  <a href="https://www.facebook.com/share/1C7DNxVRLL/" target="_blank"><img src="images/facebook-icon.png" class="app-icon icon-fb"></a>
  <a href="https://www.instagram.com/hoponhopoffdubrovnik?igsh=MW43YWR0eHJnbDE0dg==" target="_blank"><img src="images/instagram-icon.png" class="app-icon icon-ig"></a>
  <a href="#" target="_blank"><img src="images/booking-icon.png" class="app-icon icon-booking"></a>
</div>
</div>

</div>

<script>
var correctPassword = "1234";
var formData = {};
var selectedLang = "";

// Dodan broj audio stanica za cabrio turu (npr. 3)
var tours = { 
  EN:{old:2, walls:3, cabrio:3}, 
  DE:{old:4, walls:2, cabrio:3}, 
  IT:{old:4, walls:3, cabrio:3}, 
  ES:{old:4, walls:3, cabrio:3}, 
  HR:{old:4, walls:3, cabrio:3} 
};

// Dodani prijevodi za Cabrio tour
var tourTranslations = { 
  EN: {old:"Old Town", walls:"Walls", cabrio:"Cabrio Tour"}, 
  DE: {old:"Altstadt", walls:"Stadtmauern", cabrio:"Cabrio Tour"}, 
  IT: {old:"Centro Storico", walls:"Mura", cabrio:"Tour in Cabrio"}, 
  ES: {old:"Ciudad Vieja", walls:"Murallas", cabrio:"Tour en Cabrio"}, 
  HR: {old:"Stari Grad", walls:"Zidine", cabrio:"Cabrio tura"} 
};

window.onload = function(){
  document.getElementById("passwordInput").addEventListener("keypress", function(e){
    if(e.key==="Enter") checkPassword();
  });
};

function checkPassword(){
  var input=document.getElementById("passwordInput").value;
  var errorDiv=document.getElementById("passwordError");
  if(input===correctPassword){
    errorDiv.classList.remove("show");
    document.getElementById("passwordDiv").style.display="none";
    document.getElementById("formDiv").style.display="block";
  }else{
    errorDiv.textContent="Wrong password";
    errorDiv.classList.add("show");
  }
}

function validateForm(){
  var name=document.getElementById("name").value.trim();
  var surname=document.getElementById("surname").value.trim();
  var phone=document.getElementById("phone").value.trim().replace(/\s+/g,'');
  var errorDiv=document.getElementById("formError");
  if(!name || !surname || !phone){
    errorDiv.textContent="All fields are required";
    errorDiv.classList.add("show");
    return false;
  }
  errorDiv.classList.remove("show");
  formData.name = name;
  formData.surname = surname;
  formData.phone = phone;
  document.getElementById("formDiv").style.display="none";
  document.getElementById("languageDiv").style.display="block";
}

function sendDataAndGoToTour(lang){
  selectedLang = lang;
  document.getElementById("oldBtn").textContent = tourTranslations[lang].old;
  document.getElementById("wallsBtn").textContent = tourTranslations[lang].walls;
  document.getElementById("cabrioBtn").textContent = tourTranslations[lang].cabrio; // Postavlja prijevod za Cabrio
  document.getElementById("languageDiv").style.display="none";
  document.getElementById("tourDiv").style.display="block";
}

function submitTour(type){
  var scriptUrl = "https://script.google.com/macros/s/AKfycbza1righTopeYjGweA8ZaFWDdj7Q9qCWxCzCDyHLgt4d5Sx-zgDP5EwywSheFU55KalrQ/exec";
  var params = new URLSearchParams();
  params.append("ime", formData.name);
  params.append("prezime", formData.surname);
  params.append("phone", formData.phone);
  params.append("jezik", selectedLang);
  params.append("tourType", type);
  fetch(scriptUrl + "?" + params.toString(), { method: "GET", mode: "no-cors" })
  .then(() => console.log("Podaci poslani: " + type))
  .catch(err => console.log("Greška", err));

  document.getElementById("tourDiv").style.display="none";
  document.getElementById("audioListDiv").style.display="block";
  var container = document.getElementById("audioList");
  container.innerHTML = "";
  var count = tours[selectedLang][type];
  var baseUrl = "https://nik1991p.github.io/solid-journey/";
  for(let i=1; i<=count; i++){
    var block = document.createElement("div"); 
    block.style.marginBottom="20px";
    block.style.paddingBottom="10px";
    block.style.borderBottom="1px solid #555";
    var title = document.createElement("p"); 
    title.textContent = "Stop " + i;
    title.style.fontWeight = "bold";
    var audio = document.createElement("audio"); 
    audio.controls = true;
    audio.preload = "none";
    audio.src = baseUrl + "audio/" + selectedLang.toLowerCase() + "/" + type + "/" + i + ".mp3";
    block.appendChild(title); 
    block.appendChild(audio); 
    container.appendChild(block);
  }
}

function backToForm(){ document.getElementById("languageDiv").style.display="none"; document.getElementById("formDiv").style.display="block"; }
function backToLanguage(){ document.getElementById("tourDiv").style.display="none"; document.getElementById("languageDiv").style.display="block"; }
function backToTour(){ document.getElementById("audioListDiv").style.display="none"; document.getElementById("tourDiv").style.display="block"; }
</script>

</body>
</html>
