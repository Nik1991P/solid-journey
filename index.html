<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubrovnik Audio Guide</title>
<style>
body { margin:0; padding:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body::before { content:""; position:fixed; top:0; left:0; width:100%; height:100%; background:url('images/DubrovnikSlika.webp') no-repeat center center; background-size:cover; filter:blur(4px); transform:scale(1.05); z-index:-1; }
body::after { content:""; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); z-index:-1; }
.screen-center { display:flex; justify-content:center; align-items:center; height:100vh; }
.container { background:rgba(0,0,0,0.6); padding:30px; border-radius:15px; width:90%; max-width:400px; text-align:center; color:#fff; }
input { width:90%; padding:12px; margin:10px 0; border-radius:8px; border:none; font-size:16px; }
button { padding:12px 25px; font-size:16px; background:#0a7cff; color:white; border:none; border-radius:8px; margin:5px; cursor:pointer; transition:0.3s; }
button:hover { background:#005ecb; }
h2 { margin-bottom:20px; font-size:24px; }
#languageDiv button { width:80%; margin:8px 0; }
audio { width:90%; margin-top:15px; }
</style>
</head>
<body>

<div class="screen-center">
  <div id="formDiv" class="container">
    <h2>Dubrovnik Audio Guide</h2>
    <p>Please enter your details:</p>
    <input id="name" placeholder="Name"><br>
    <input id="surname" placeholder="Surname"><br>
    <input id="phone" placeholder="Phone"><br>
    <button type="button" onclick="submitForm()">Submit</button>
  </div>

  <div id="languageDiv" class="container" style="display:none">
    <h2>Select your language</h2>
    <button onclick="selectLanguage('EN')">English</button><br>
    <button onclick="selectLanguage('HR')">Hrvatski</button><br>
    <button onclick="selectLanguage('DE')">Deutsch</button><br><br>
    <button type="button" onclick="backToForm()">Back</button>
    <br>
    <audio id="audioPlayer" controls style="display:none"></audio>
  </div>
</div>

<script>
// Audio linkovi
var audioLinks = {
  EN: "audio/audio_en.mp3",
  HR: "audio/audio_hr.mp3",
  DE: "audio/audio_de.mp3"
};

var formData = {};

// Submit forma
function submitForm() {
  var name = document.getElementById("name").value.trim();
  var surname = document.getElementById("surname").value.trim();
  var phone = document.getElementById("phone").value.trim();

  if(!name || !surname || !phone){
    alert("Please fill all fields!");
    return;
  }

  formData.name = name;
  formData.surname = surname;
  formData.phone = phone;

  document.getElementById("formDiv").style.display = "none";
  document.getElementById("languageDiv").style.display = "block";
}

// Back dugme
function backToForm() {
  document.getElementById("languageDiv").style.display = "none";
  document.getElementById("formDiv").style.display = "block";
  document.getElementById("audioPlayer").style.display = "none";
}

// Odabir jezika
function selectLanguage(lang) {
  formData.language = lang;

  // Pošalji podatke u Sheet
  fetch("https://script.google.com/macros/s/AKfycbxWK8JV-t720Ywhr2jBwpVBsVpnCkvIINVHl3mDkFXbUy1e7Mj5vkBBeK72KOttOY2UdQ/exec", { // <-- zamijeni sa URL iz deploya
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(formData)
  })
  .then(res => res.json())
  .then(data => console.log("Saved:", data))
  .catch(err => console.log("Error:", err));

  // Pokreni audio
  var player = document.getElementById("audioPlayer");
  player.src = audioLinks[lang];
  player.style.display = "block";
  player.play();
}
</script>

</body>
</html>
